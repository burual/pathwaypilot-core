name: CI

# ---------------------------------------------------------------------------
# 触发条件
#   - push 到 main / dev
#   - PR 目标分支为 main
#   - 手动触发（workflow_dispatch），便于跑一次全量矩阵排查
# ---------------------------------------------------------------------------
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 最小权限：CI 只需要读代码；上传 artifact 不需要 write
permissions:
  contents: read

# 同一分支的新 push 会取消上一次未跑完的任务，省 CI 分钟数
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # 固定 UTF-8，避免 Windows 贡献者的中文输出在 runner 上乱码
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: "1"
  # 覆盖率门禁 —— 棘轮（ratchet），只准升不准降。
  #   2026-10-05 实测：全量计入（branch 口径，含 viz/）= 71.68%。
  #   ⚠️ 此处原先写「基线 82.7%，卡 80」——那个 82.7% 是 viz/ 加入**之前**的数字。
  #      viz/ 新增 8 个绘图模块、只有 volcano 有测试，其中 6 个模块覆盖率仅
  #      10~18%，把总分从 91.2%（语句口径，排除 viz/）拉到 76.3%（branch 71.7%）。
  #      也就是说 80 这个门槛从未真正达标过 —— 因为仓库此前没有远端，
  #      这个 workflow 一次都没被执行过，门禁形同虚设。
  #   口径选择：全量计入 + 卡当前实测值，而不是「排除 viz/ 后卡 80」。
  #      理由是口径诚实 —— viz/ 的缺口留在报告里看得见，不被 omit 藏掉。
  #      代价是余量只有约 0.7pp，开发中新加未测代码会立刻变红（这是棘轮的本意）。
  #      ⚠️ 补上 viz/ 那几个绘图模块的测试后，务必同步上调本值。
  COVERAGE_MIN: "71"
  # Codecov token 必须提到 workflow 级 env：
  #   ⚠️ `secrets` 上下文**不允许出现在任何 `if` 表达式里**（GitHub 硬规则），
  #      写 `if: secrets.X != ''` 会让整个 workflow 在解析阶段被拒
  #      （报 "Unrecognized named-value: 'secrets'"，run 瞬间失败、0 个 job）。
  #      正解就是这里映射成 env，再在 if 里判 `env.CODECOV_TOKEN != ''`。
  #   注意：step 自己的 `env:` 里刚声明的值，在同 step 的 `if` 里也读不到，
  #   所以只能放在 workflow 级。
  #   未配置该 secret 时值为空串，Codecov 那步会被跳过（不影响 CI 结果）。
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

jobs:
  # =========================================================================
  # Job 1 — 静态质量门禁（只跑一次，Python 3.12）
  #
  # 为什么单独成 job：ruff / mypy / 循环依赖检测的结果与 Python 版本无关，
  # 放进 3 版本矩阵等于白跑 3 遍。这一步跑得快、失败早，矩阵 job 也就不会
  # 白白启动 3 个 runner。
  # =========================================================================
  quality:
    name: Lint / Types / Circular deps
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # --output-format=github 会把违规渲染成 PR 的行内注释
      - name: ruff lint
        run: ruff check --output-format=github .

      # ⚠️ 暂时**不阻塞**：实测 `ruff format --check` 会重排 24/25 个文件
      #    （多行调用合并成单行、参数换行策略等），属于全仓纯格式改写。
      #    这类改动最好单独成一个 PR 提，混进「引入 CI」的提交里会淹没真实改动。
      #    跑通一次 `ruff format .` 并 review 后，把 continue-on-error 删掉即可转正。
      - name: ruff format check (non-blocking, see comment)
        continue-on-error: true
        run: ruff format --check --diff .

      - name: mypy type check
        run: mypy .

      - name: circular dependency check (blocking)
        run: python check_circular_deps.py .

      # 延迟导入是项目推荐的断环手段，默认模式不算环。
      # 这里额外跑一遍审计模式（把函数内 / TYPE_CHECKING 内的导入也算上），
      # 仅报告不拦截 —— 出现环说明有值得复核的隐藏耦合，但不必卡住 PR。
      - name: circular dependency audit (non-blocking)
        continue-on-error: true
        run: python check_circular_deps.py . --include-lazy

  # =========================================================================
  # Job 2 — 测试矩阵（Python 3.10 / 3.11 / 3.12）
  #
  # fail-fast: false —— 一个版本挂了不要取消其他版本，否则拿不到完整诊断。
  # 这里跑**全量**用例（含 slow + integration）；pre-commit 那边才用
  # `-m "not slow and not integration"` 跑快子集。
  # ⚠️ integration 用内存 SQLite + FastAPI TestClient，不需要任何外部服务，
  #    因此在 runner 上无需 service container 也能跑。
  # =========================================================================
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # ⚠️ 用 `--cov`（不带值）而不是 `--cov=src`：
      #    本仓没有 src/ 目录，源码在仓库根 + repositories/ + utils/。
      #    `--cov=src` 会「No data was collected」但**退出码仍是 0**，静默假绿。
      #    source 由 .coveragerc 的 [run] source 决定。
      - name: pytest with coverage
        run: |
          set -o pipefail
          python -m pytest \
            --cov \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=json \
            --cov-report=html \
            --cov-fail-under=${{ env.COVERAGE_MIN }} 2>&1 | tee pytest-output.log

      # 把失败详情转成 GitHub annotation 贴到 run 页面上。
      #
      # ⚠️ 为什么需要这一步（实测踩过）：Actions 的日志下载端点**需要鉴权** ——
      #    未登录访问 `/repos/<o>/<r>/actions/jobs/<id>/logs` 返回
      #    403 "Must have admin rights to Repository."，而 job 页面的日志是 JS
      #    动态加载的，抓不到正文。结果是：**公开仓库的 CI 失败了，却没法从外部
      #    定位原因**（排查必须登录，或把日志贴进 issue）。
      #    annotation 不一样 —— 它通过 `/commits/<sha>/check-runs` +
      #    `.../annotations` 公开可读，任何人在页面上也能直接看到。
      #
      # 内容 = Python 版本 + 关键依赖版本 + pytest 输出末尾 50 行。
      # 依赖版本是刻意的：多版本矩阵里「同一个 requirements 在不同 Python 上
      # 解析出不同版本」是最难查的一类失败，把版本钉在失败现场能省一整轮排查。
      - name: Surface failure details as annotation
        if: failure()
        run: |
          python - <<'PY'
          import importlib.metadata as md
          import pathlib
          import sys

          head = ["python: " + sys.version.replace("\n", " ")]
          keys = ("pytest", "pytest-cov", "pytest-asyncio", "fastapi", "starlette",
                  "pydantic", "sqlalchemy", "httpx", "numpy", "matplotlib", "scipy",
                  "scikit-learn", "plotly", "mplcursors")
          vers = []
          for k in keys:
              try:
                  vers.append("%s=%s" % (k, md.version(k)))
              except Exception:
                  vers.append("%s=?" % k)
          head.append(" | ".join(vers))

          log = pathlib.Path("pytest-output.log")
          tail = log.read_text(errors="replace").splitlines()[-50:] if log.is_file() else ["(no log)"]
          text = "\n".join(list(head) + list(tail))
          esc = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=pytest failed on py%s::%s"
                % (".".join(map(str, sys.version_info[:2])), esc))
          PY

      - name: Upload coverage report
        # always() —— 测试失败时更要把报告留下来定位问题
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: |
            coverage.xml
            coverage.json
            htmlcov/
          if-no-files-found: warn
          retention-days: 14

      # 可选：把覆盖率推到 Codecov（需先在仓库 Secrets 配置 CODECOV_TOKEN）
      # 只从 3.12 上传一次，避免三个版本互相覆盖同一份报告。
      # ⚠️ 判断 token 是否存在必须读 workflow 级 env（见文件顶部 env 块的说明）：
      #    `secrets` 上下文在 `if` 里不合法，会让 workflow 解析失败。
      - name: Upload to Codecov
        if: ${{ always() && matrix.python-version == '3.12' && env.CODECOV_TOKEN != '' }}
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
