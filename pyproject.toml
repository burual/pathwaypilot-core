# pyproject.toml — 构建元数据 + ruff / mypy / pytest 三套工具配置
#
# 为什么需要它：你说「CI 步骤：安装依赖 → ruff → mypy → pytest」，
# 但这三样都需要配置才能跑，而本仓此前没有 pyproject.toml / pytest.ini。
# 把配置集中在这里，可以让 CI、pre-commit、本地 IDE 用**同一份**规则（避免
# 「本地过 CI 不过」）。如果你更想用独立的 ruff.toml / mypy.ini，把对应段
# 整段搬出去即可，键名不变。

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathwaypilot-core"
version = "0.1.0"
description = "PathwayPilot 后端核心：BaseService 基类、Repository 数据层、utils 工具模块"
readme = "README.md"
# ⚠️ 与 CI 矩阵保持一致（3.10 / 3.11 / 3.12）；提到 3.11+ 会让最低版本 job 变红
requires-python = ">=3.10"
# 2026-10-05：由 "Proprietary" 改为 MIT —— 仓库以公开形式发布，
# 专有声明与公开可见的语义相冲突。MIT 全文见仓库根 LICENSE。
# ⚠️ 仍用 PEP 621 的 { text = ... } 写法而非 PEP 639 的字符串字面量：
#   后者要求 setuptools >= 77，而本仓 build-system 声明的是 >= 68。
license = { text = "MIT" }

# 运行时依赖
dependencies = [
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    # viz/volcano.py 的 VolcanoResult 用 NotRequired 标注可选键；
    # NotRequired 直到 Python 3.11 才进入标准库，3.10 上需从这个 backport 包取。
    # ⚠️ 用环境标记限定，3.11+ 上不引入多余依赖。
    'typing_extensions>=4.6; python_version < "3.11"',
]

# 开发/测试依赖。这里与 requirements-dev.txt 内容保持一致；
# 保留这个 extras 是为了 `pip install -e ".[dev]"` 这条路能用。
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "fastapi>=0.110",
    "httpx>=0.27",
    "ruff>=0.16.7",
    "mypy>=2.3",
    "pre-commit>=3.5",
]

# ===========================================================================
# ruff
# ===========================================================================
[tool.ruff]
target-version = "py310"
# ⚠️ 定 100，**不要再改成 120** —— 2026-09-15 实测过：放宽行长会「新增」违规，
#    而不是减少。原因见下：ruff 会抑制「修复后会超出行长」的 fix，所以
#      line-length=100 → All checks passed
#      line-length=120 → 新增 SIM108（search_service.py:82，那个三元表达式
#                        一行 108 字符，100 下压根不提议合并，120 下开始要求合并）
#    而 E501 已在下方 ignore、行长上限由 ruff format 兜底 → 改 120 对 lint 零收益，
#    只会扩大规则面并让格式目标漂移。完整测量见 lint_typecheck_audit.md §1.3。
line-length = 100
# 生成物、救援目录、记忆目录不要扫
extend-exclude = [
    "htmlcov",
    ".git_rescue",
    ".workbuddy",
    ".venv",
    "build",
    "dist",
    # _probe/ = 一次性浏览器/网络测量工装（Playwright 探针、字节级采集脚本），
    # 不是产品代码：里面刻意用宽松异常、动态 dict、临时路径。留在门禁面里
    # 只会制造噪音（09-17 实测 +10 条 ruff 错 / +4 条 mypy 错），故与 build/dist 同理排除。
    "_probe",
    "**/*.md",
]

[tool.ruff.lint]
# 规则集说明：
#   E/W = pycodestyle、F = pyflakes（真 bug 类）、I = isort、UP = pyupgrade
#   B = bugbear、C4 = comprehensions、SIM = simplify、N = pep8-naming、PTH = pathlib、RUF = ruff 专有
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "N", "PTH", "RUF"]
ignore = [
    # ---- 中文代码库的必备豁免 ----
    # RUF001/002/003 报「docstring/注释/字符串里有 ambiguous Unicode 字符」，
    # 对全角标点（）， ： 「」 等一律报错。本项目是**中文注释**的：
    # 实测 1020 条违规里 877 条（86%）是这条 —— 属于纯粹的误报，必须豁免。
    # 若哪天要写纯英文注释再打开。
    "RUF001",
    "RUF002",
    "RUF003",

    # ---- 待专项 PR 再开的「大规模改写」类规则 ----
    # UP006/UP007/UP045：把 typing.List/Dict/Optional[X] 改写成 list/dict/X | None。
    #   安全（文件都有 from __future__ import annotations，且 requires-python>=3.10），
    #   但会一次性改动 ~77 处注解，属于纯风格批量改写 —— 与 CI 引入分开成一个 PR 更易审。
    # UP035：typing.Callable/Mapping -> collections.abc。
    "UP006",
    "UP007",
    "UP035",
    "UP045",

    # 行宽交给 ruff format，lint 不再重复报
    "E501",
    # 允许 pass 占位（Protocol 桩、异常类体）
    "PIE790",
    # 与 pydantic / sqlalchemy 惯用法冲突
    "RUF012",

    # ---- 待专项清理的「纯风格」项（都已定位到具体行，见备注） ----
    # RUF005 列表拼接建议改成 [*a, b]：check_circular_deps.py:232,251
    "RUF005",
    # C416 多余字典推导：coverage_gaps.py:64（`{i: s for i, s in enumerate(x)}`）
    "C416",
    # UP031 printf 风格：utils/cache.py:184（`'W/"%s"' % digest`，这里的 % 用于拼引号，可读性不差）
    "UP031",
    # RUF046 多余的 int() 转换：utils/time.py:128（`int(round(x))`）
    "RUF046",
]

[tool.ruff.lint.per-file-ignores]
# 测试里：fixture 参数名可任意大小写、允许函数内 import 便于 monkeypatch
"tests/**" = ["N802", "N803", "N806", "E402", "F811", "F401"]
#   ↑ F401：tests/test_coverage_gaps.py 是**模板脚手架**，刻意预先 import 了
#     datetime / logging / time / MagicMock / patch，供填实现时直接用；
#     删掉反而让模板作者的注释失去对应物。
# FastAPI 的依赖注入惯用法就是「默认参数里调用 Depends(...)」，
# B008（function-call-in-default-argument）对它必然是误报。
"tests/conftest.py" = ["B008", "N806"]
# 检测器/覆盖率工具是独立脚本，允许 CLI 风格命名与 printf 格式化
"check_circular_deps.py" = ["N802", "UP031", "N806"]
#   ↑ N806：:220 的 `WHITE/GRAY/BLACK` 是 ANSI 颜色**常量**，
#     在函数内定义成大写是正确写法，N806 在此属误报。
"coverage_gaps.py" = ["N802", "UP031"]
# example_gene_service.py 底部的 FastAPI DI 接线是**注释形式**的示例，
# get_repository 这个 import 是为那段示例保留的，静态看是「未使用」。
"example_gene_service.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["app", "db_models", "repositories", "schemas", "tests", "utils", "viz"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# ⚠️ 保持 CRLF 原样：PathMind/ 下是 CRLF，若设为 "native"/"\r\n" 会把
#    gateway/ 下的 LF 文件全部改写，产生巨量无关 diff。
line-ending = "auto"

# ===========================================================================
# mypy
# ===========================================================================
[tool.mypy]
# ⚠️ 实测踩坑记录（这一段花了最多时间，别随手改）：
#   最初写的是 python_version = "3.10"（想和 requires-python / CI 矩阵对齐），
#   结果 mypy 一上来就死：
#     numpy\__init__.pyi:737: error: Type statement is only supported in Python 3.12 and greater [syntax]
#     Found 1 error in 1 file (errors prevented further checking)   ← exit 2，整个检查中止
#   原因**不在我们的代码**（全仓没有任何 numpy import）：本 venv 里装了 numpy 2.5，
#   它的 .pyi 用了 PEP 695 `type` 语句，只有 3.12+ 的语法解析器能吃。
#   而 python_version 同时决定了「解析第三方 stub 时用哪套语法」。
#   验证方法：`mypy --config-file=<空配置> tests/conftest.py` 立刻干净
#   —— 空配置时 mypy 跟随运行解释器（3.13），stub 就能解析。
#
#   因此这里钉 3.12（= CI 里 quality job 的 runner 版本），让 mypy 目标明确且可复现。
#   为什么不钉 3.10 再把 numpy 跳过：numpy 的错是 syntax 级，
#   `follow_imports = "skip"` 与 `ignore_errors` 都拦不住（stub 在 override 生效前就被解析）。
#   ⚠️ 代价：mypy 不再替你发现「3.10 不支持的注解写法」。但这个风险由 CI 的
#   3.10/3.11 测试 job **真实执行**来兜底 —— 那比静态推断更可信。
python_version = "3.12"
files = ["."]
# _probe/ 同 ruff：一次性测量工装，非产品代码（理由见 tool.ruff.extend-exclude 处注释）
exclude = '(^|/)(htmlcov|\.git_rescue|\.workbuddy|build|dist|_probe)/'

# 渐进式：先保证「真类型错误」为 0，不追求 strict。
# ⚠️ 2026-09-15 实测过 `strict = true` 的代价，并**决定暂不开启**：
#    源码 47 错 + 测试 82 错 = 129 条，其中 **P0（可能运行时崩）为 0** —— 4 处命中
#    P0 类规则（attr-defined/operator/union-attr）的地方都有上游守卫挡住，
#    其余绝大多数是 type-arg（dict 缺泛型参数）与 no-any-return。
#    ⚠️ 真要开，必须同时关**两个**开关才能兑现「允许未类型化的函数定义」：
#      disallow_untyped_defs = false **不够**，还得 disallow_incomplete_defs = false
#      （后者管「有返回注解、但参数没注解」，本仓测试里极多，漏关会多报 80+ 条）。
#    分级清单 + 分阶段还债路线见 lint_typecheck_audit.md；若只想让严格度**可观测
#    但不阻塞**，正确做法是加一个 continue-on-error 的只读 job（同本仓已有的
#    lint-PathMind / lint-full 恒绿只读 job），而不是把 required check 变成红的。
warn_unused_configs = true
warn_redundant_casts = true
# ⚠️ 关掉「未使用的 type: ignore」检查：当前有 3 处（utils/text.py:31 的
#    `import jieba  # type: ignore`、repositories/__init__.py:51、
#    tests/test_services.py:248）。它们是因为全局 ignore_missing_imports=true
#    之后变得多余的。清理它们要动源码，而本工作区没有 .git 可回滚，
#    所以先关检查、把「删掉这 3 处冗余 ignore」留作独立清理。
#    想开回来：把本行改 true 并删掉那 3 处注释即可。
warn_unused_ignores = false
no_implicit_optional = true
strict_equality = true

# 未标注类型的函数体不做检查（避免对既有代码一次性报上千条）
check_untyped_defs = false
disallow_untyped_defs = false

# 第三方库缺 stub 时不报错
ignore_missing_imports = true

# 逐模块放宽：这些位置的动态用法是刻意的
#
# ⚠️ 模块名写法有坑：tests/ 目录下**没有 __init__.py**，所以 mypy 把这些文件
#    视为顶层模块 `test_utils` / `conftest`，而**不是** `tests.test_utils`。
#    想写通配符也不行：mypy 只接受「完全限定的模块名 + 完整组件通配」，
#    写 module = "test_*" 会直接报
#      Patterns must be fully-qualified module names, optionally with '*' in some components
#    所以这里逐个列出（新增测试文件时**记得补进来**，否则它会开始参与严格检查）。
[[tool.mypy.overrides]]
module = [
    "conftest",
    "test_auth",
    "test_circular_deps",
    "test_coverage_gaps",
    "test_data",
    "test_integration_api_flow",
    "test_integration_gene_crud",
    "test_routes",
    "test_services",
    "test_utils",
    "test_viz_volcano",
]
# conftest 用 sys.modules 注入桩模块、动态 patch；测试里的替身类型必然不满
ignore_errors = true

[[tool.mypy.overrides]]
module = ["service_protocols", "coverage_gaps", "check_circular_deps"]
# 三者都用 __import__ / ast 动态取属性
ignore_errors = true

[[tool.mypy.overrides]]
module = ["repositories", "repositories.*"]
# 实测 4 条报错，全部源自 SQLAlchemy 的宽泛标注而非真缺陷：
#   repositories/base.py:127,131  sa_inspect(...) 返回 `Any | None`，直接取
#                                 .columns / .primary_key 被判 union-attr
#   repositories/__init__.py:51   `repo: Type[RepoT] | str` 收窄后调用被判 operator
# 正确修法是补 isinstance 断言或 cast，但同样要动源码（无 .git 可回滚），
# 故先在此豁免，留作独立清理。
disable_error_code = ["union-attr", "operator"]

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "pandas", "pandas.*", "scipy", "scipy.*", "matplotlib", "matplotlib.*"]
# ⚠️ 这条注释在新增 viz/ 之后**已经过时**，但配置保留不动（改它有实测风险）：
#   · 原话「本项目源码不依赖这些科学计算库」已不成立 —— viz/ 的 8 个绘图模块
#     就构建在 numpy + matplotlib 之上；
#   · 之所以仍保留 follow_imports = "skip"：本 venv 里 numpy 2.5 的 .pyi 使用
#     PEP 695 `type` 语法，一旦让 mypy 真正解析它，python_version 设成 3.10/3.11
#     会直接 syntax 报错并中止整个检查（exit 2）。因此「跳过科学计算库」仍然是
#     最省事的选择，代价见下一条 viz 的豁免。
follow_imports = "skip"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["viz", "viz.*"]
# 实测 9 条 var-annotated，形态全部是 `x = np.asarray(...)`：
#   volcano.py:238,239 / ma_plot.py:40,47 / pca_plot.py:39,100 /
#   heatmap.py:68 / correlation.py:41,50
# 根因就是上一条的 follow_imports = "skip" —— mypy 拿不到 np.asarray 的元素类型，
# 于是把「推不出类型」报成「缺注解」。给这 9 个局部变量逐个补 `: Any` 只是把工具
# 局限抄进源码，故按本仓已有惯例（见 base_service / repositories 两条）就近豁免。
# 注意它只关 var-annotated 一项，真类型错误仍会报出来。
disable_error_code = ["var-annotated"]

[[tool.mypy.overrides]]
module = "base_service"
# 实测：BaseService 上定义了名为 `list` 的 CRUD 模板方法，于是在类作用域内
# `list[...]` 这个注解被解析成「该方法的引用」而不是内建 list，产生两条
# 误报：valid-type（"BaseService.list" is not valid as a type）与
# var-annotated（`items = list(...)` 推不出类型）。
# 运行时完全正常（注解因 from __future__ import annotations 不求值），
# 属于「方法名撞内建名」的静态分析代价，就近豁免。
disable_error_code = ["valid-type", "var-annotated"]

# ===========================================================================
# pytest
# ===========================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra 汇总 skip/xfail 原因；--strict-markers 让拼错的 marker 直接报错而不是静默通过
addopts = "-ra --strict-markers"
# ⚠️ 必须注册 slow / integration：pre-commit 用 `-m "not slow and not integration"` 过滤，
#    未注册的 marker 在 --strict-markers 下会让整个测试会话报错（收集阶段直接挂）。
# ⚠️ 每个 marker 必须是**单个**字符串字面量：TOML 不像 Python 支持相邻字符串自动拼接，
#    写成两行相邻字符串会报 Unclosed array。
markers = [
    "slow: 慢用例（集成/大文件/网络）。pre-commit 里被排除，CI 全量跑。",
    "integration: 集成用例（真实 SQLite / 真实 FastAPI TestClient，不打 mock）。单独跳过：pytest -m \"not integration\"。",
]
# 覆盖率默认项放这里，CI 只用 --cov 触发，无需重复写一长串 report 参数
# （source 由 .coveragerc 决定，本仓没有 src/ 目录）
